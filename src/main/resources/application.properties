spring.application.name=gestion-usuarios

# ==========================================
# Base de datos H2 en memoria
# ==========================================
spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Consola H2 (http://localhost:8080/h2-console)
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

server.port=8080

# ==========================================
# Seguridad
# ==========================================
# Usuario basico para las rutas protegidas (HTTP Basic). El valor se hashea
# con BCrypt al arrancar (ver SecurityAppConfig).
#
# No se declara ninguna contrasena aqui a proposito: Spring Boot genera una
# aleatoria en cada arranque y la imprime en el log ("Using generated security
# password: ..."). Para fijar una, exporta SPRING_SECURITY_USER_PASSWORD.
# En produccion debe sustituirse por un proveedor real (JWT / OAuth2).
spring.security.user.name=${APP_SECURITY_USER:admin}